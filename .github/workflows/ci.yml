name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render an example with the CLI
        run: |
          npx playwright install --with-deps chromium
          node bin/clipframe.js render examples/taskflow-promo/project.json -o out.mp4 --resolution 720p
          test -s out.mp4
          node bin/clipframe.js render examples/html-css/project.json --blocks examples/html-css/price.js -o html.mp4 --resolution 720p
          test -s html.mp4
