<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipframe Playground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><path d='M12 9l12 7-12 7z' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="./site.css" />
    <style>
      .pg-head { display:flex; align-items:center; gap:24px; height:64px; padding:0 24px; border-bottom:1px solid var(--line); }
      .pg-head p { margin:0; color:var(--text-3); font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .pg { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:20px; padding:20px 24px; max-width:1600px; margin:0 auto; }
      @media (max-width: 900px) { .pg { grid-template-columns:1fr; padding:16px; } .pg-head p { display:none; } }
      .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
      .toolbar select { height:36px; padding:0 14px; border:1px solid var(--line-2); border-radius:999px; background:var(--bg-2); color:var(--text); font:14px var(--font); }
      #status { color:var(--text-3); font-size:13px; }
      #status a { color:var(--text); }
      #player { border:1px solid var(--line); border-radius:14px; padding:12px; background:var(--bg-2); }
      .clipframe-player canvas { max-height:calc(100vh - 250px); object-fit:contain; border-radius:8px !important; }
      .clipframe-player button { background:var(--ink) !important; color:var(--on-ink) !important; }
      .clipframe-player input[type=range] { accent-color:var(--text); }
      .clipframe-player span { color:var(--text-3); font-family:var(--mono); }
      textarea { width:100%; height:calc(100vh - 150px); min-height:360px; resize:vertical; background:var(--frame-bg); color:var(--code-text); border:1px solid var(--line); border-radius:14px; padding:16px; font:12.5px/1.6 var(--mono); outline:none; }
      textarea:focus { border-color:var(--line-2); }
      #errors { color:#f87171; font:12px/1.5 var(--mono); white-space:pre-wrap; margin-top:8px; }
    </style>
  </head>
  <body>
    <header class="pg-head">
      <a class="brand" href="./" aria-label="Clipframe home"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="disc" cx="32" cy="32" r="31"/><path class="mark" d="M26 21.5 45 32 26 42.5z"/></svg>Clipframe <span class="soft" style="font-weight:400">Playground</span></a>
      <p>Edit the JSON, watch it play, export an MP4. Everything runs in your browser.</p>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn small" href="https://github.com/ferdousmikdad/clipframe">GitHub</a>
    </header>
    <main class="pg">
      <section class="stage" style="padding:0">
        <div class="toolbar">
          <select id="example" aria-label="Example"></select>
          <select id="res" aria-label="Export size"><option>1080p</option><option>720p</option></select>
          <button id="export" class="btn primary small">Export MP4</button>
          <span id="status"></span>
        </div>
        <div id="player"></div>
      </section>
      <section style="padding:0">
        <textarea id="json" spellcheck="false" aria-label="Project JSON"></textarea>
        <div id="errors"></div>
      </section>
    </main>
    <script type="module" src="./playground.ts"></script>
  </body>
</html>
